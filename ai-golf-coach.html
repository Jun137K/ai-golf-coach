<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Golf Coach</title>

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;
    background:#101418;
    color:white;
}

header{
    text-align:center;
    padding:20px 10px;
}

h1{
    margin:0;
    font-size:25px;
}

.subtitle{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:10px 15px 30px;
}

.card{
    background:#1b2229;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
}

h2{
    font-size:18px;
    margin-top:0;
}

button{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:0;
    border-radius:12px;
    background:#2f7df6;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:disabled{
    opacity:.4;
}

video{
    width:100%;
    border-radius:14px;
    background:black;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:10px;
    border:0;
    font-size:16px;
}

.result{
    text-align:center;
    font-size:38px;
    font-weight:bold;
    margin:15px 0;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#252e37;
    border-radius:12px;
    padding:12px 5px;
    text-align:center;
}

.number{
    font-size:22px;
    font-weight:bold;
}

.small{
    font-size:11px;
    color:#aaa;
}

.note{
    color:#aaa;
    font-size:12px;
    line-height:1.6;
}

#aiMessage{
    white-space:pre-line;
    line-height:1.7;
    margin-top:12px;
}
</style>
</head>

<body>

<header>
<h1>🏌️ AI Golf Coach</h1>
<div class="subtitle">
練習場用 スイング＆飛距離チェック
</div>
</header>

<div class="container">

<!-- カメラ -->

<div class="card">

<h2>📷 スイング撮影</h2>

<video
id="video"
autoplay
playsinline
muted>
</video>

<button id="startCamera">
📷 カメラを開始
</button>

<button id="stopCamera" disabled>
⛔ カメラ停止
</button>

</div>


<!-- AI -->

<div class="card">

<h2>🤖 AIフォーム解析</h2>

<button id="aiButton">
AI解析開始
</button>

<div id="aiMessage">
カメラを開始してから
AI解析を押してください。
</div>

</div>


<!-- クラブ -->

<div class="card">

<h2>⛳ クラブ</h2>

<select id="club">

<option>ドライバー</option>
<option>3W</option>
<option>5W</option>
<option>5番アイアン</option>
<option>6番アイアン</option>
<option selected>7番アイアン</option>
<option>8番アイアン</option>
<option>9番アイアン</option>
<option>PW</option>
<option>SW</option>

</select>

</div>


<!-- 飛距離 -->

<div class="card">

<h2>📏 飛距離</h2>

<p>
ボールが落ちた距離を入力してください
</p>

<input
id="distance"
type="number"
placeholder="例：150">

<button id="save">
飛距離を記録
</button>

<div
id="result"
class="result">
--- yd
</div>

<div class="stats">

<div class="stat">

<div
id="best"
class="number">
--
</div>

<div class="small">
最高飛距離
</div>

</div>

<div class="stat">

<div
id="average"
class="number">
--
</div>

<div class="small">
平均飛距離
</div>

</div>

<div class="stat">

<div
id="count"
class="number">
0
</div>

<div class="small">
記録球数
</div>

</div>

</div>

</div>


<!-- 記録 -->

<div class="card">

<h2>📋 今日の記録</h2>

<div id="log">
まだ記録がありません。
</div>

</div>


<div class="card">

<div class="note">

このアプリは試作版です。<br><br>

AIフォーム解析では、カメラ映像から
人体の姿勢を検出する機能を搭載予定です。<br><br>

飛距離については、現在は入力方式です。
今後、練習場の距離表示とカメラ映像を利用して
自動推定する機能へ発展させます。

</div>

</div>

</div>


<script>

let stream = null;

let distances =
JSON.parse(
localStorage.getItem("golfDistances") || "[]"
);


/* -----------------
   統計表示
----------------- */

function updateStats(){

    document.getElementById("count")
    .textContent =
    distances.length;

    if(distances.length === 0){

        document.getElementById("best")
        .textContent="--";

        document.getElementById("average")
        .textContent="--";

        document.getElementById("log")
        .textContent=
        "まだ記録がありません。";

        return;
    }

    const best =
    Math.max(...distances);

    const average =
    distances.reduce(
        (a,b)=>a+b,0
    ) / distances.length;

    document.getElementById("best")
    .textContent=best;

    document.getElementById("average")
    .textContent=
    Math.round(average);

    document.getElementById("log")
    .textContent =
    distances
    .map(
        (d,i)=>
        `${i+1}球目　${d} yd`
    )
    .join("\n");
}

updateStats();


/* -----------------
   カメラ開始
----------------- */

document
.getElementById("startCamera")
.onclick =
async function(){

    try{

        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"environment"
            },

            audio:false

        });

        document
        .getElementById("video")
        .srcObject=stream;

    }
    catch(error){

        alert(
        "カメラを起動できません。\n\n"+
        "Safariのカメラ許可を確認してください。"
        );

    }

};


/* -----------------
   カメラ停止
----------------- */

document
.getElementById("stopCamera")
.onclick =
function(){

    if(stream){

        stream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        stream=null;

        document
        .getElementById("video")
        .srcObject=null;
    }

};


/* -----------------
   AIボタン
----------------- */

document
.getElementById("aiButton")
.onclick =
function(){

    const message =
    document.getElementById("aiMessage");

    message.textContent =
`AIフォーム解析の試作モードです。

今後この部分に、

● 頭の位置
● 肩のライン
● 腰のライン
● 膝の位置
● アドレス
● トップ
● インパクト
● フィニッシュ

をAIで解析する機能を追加します。

さらに、

「頭が動いています」
「トップで体が起きています」
「インパクトで腰の回転が不足しています」

などのAIコーチングへ発展できます。`;

};


/* -----------------
   飛距離保存
----------------- */

document
.getElementById("save")
.onclick =
function(){

    const input =
    document.getElementById("distance");

    const value =
    Number(input.value);

    if(!value || value<=0){

        alert(
        "飛距離を入力してください。"
        );

        return;
    }

    distances.push(
        Math.round(value)
    );

    localStorage.setItem(
        "golfDistances",
        JSON.stringify(distances)
    );

    document
    .getElementById("result")
    .textContent =
    Math.round(value)+" yd";

    updateStats();

    input.value="";

};

</script>

</body>
</html>
