<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               viewport-fit=cover">

<title>AI Golf Coach</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101418;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

header {
    text-align: center;
    padding: 18px 12px 10px;
}

h1 {
    margin: 0;
    font-size: 24px;
}

.subtitle {
    color: #aeb7c2;
    font-size: 12px;
    margin-top: 5px;
}

.container {
    max-width: 720px;
    margin: auto;
    padding: 8px 14px 30px;
}

.card {
    background: #1b2229;
    border-radius: 18px;
    padding: 15px;
    margin: 10px 0;
}

h2 {
    font-size: 17px;
    margin: 5px 0 12px;
}

.badge {
    display: inline-block;
    background: #26384d;
    color: #9fc7ff;
    border-radius: 20px;
    padding: 5px 10px;
    font-size: 11px;
    margin-bottom: 8px;
}

.video-area {
    position: relative;
    width: 100%;
    background: black;
    border-radius: 14px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

button {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 8px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    background: #2f7df6;
}

button.secondary {
    background: #303942;
}

button.danger {
    background: #c73a45;
}

button:disabled {
    opacity: 0.4;
}

label {
    display: block;
    color: #b9c2cc;
    font-size: 12px;
    margin: 10px 0 5px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border-radius: 11px;
    border: none;
    font-size: 16px;
}

.result {
    text-align: center;
    font-size: 34px;
    font-weight: bold;
    padding: 15px 0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.stat {
    background: #252e37;
    border-radius: 13px;
    text-align: center;
    padding: 12px 5px;
}

.number {
    font-size: 23px;
    font-weight: bold;
}

.unit {
    font-size: 10px;
    color: #aeb7c2;
}

.note {
    color: #aeb7c2;
    font-size: 12px;
    line-height: 1.6;
}

.advice {
    white-space: pre-line;
    line-height: 1.7;
    font-size: 14px;
}

#log {
    white-space: pre-line;
    color: #c6ced6;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>🏌️ AI Golf Coach</h1>
    <div class="subtitle">
        練習場用・スイング＆飛距離チェック
    </div>
</header>

<div class="container">

<!-- カメラ -->
<div class="card">

    <span class="badge">STEP 1</span>

    <h2>📷 スイング撮影</h2>

    <div class="video-area">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

    </div>

    <div class="row">

        <button id="startCamera">
            📷 カメラ開始
        </button>

        <button
            id="stopCamera"
            class="danger"
            disabled>
            停止
        </button>

    </div>

</div>


<!-- AI解析 -->

<div class="card">

    <span class="badge">STEP 2</span>

    <h2>🤖 AIフォーム解析</h2>

    <button id="aiButton">
        AI解析開始
    </button>

    <div
        id="aiMessage"
        class="advice"
        style="margin-top:12px;">
        カメラを開始してから
        「AI解析開始」を押してください。
    </div>

</div>


<!-- クラブ -->

<div class="card">

    <span class="badge">STEP 3</span>

    <h2>⛳ クラブ</h2>

    <select id="club">

        <option>ドライバー</option>
        <option>3W</option>
        <option>5W</option>
        <option>5番アイアン</option>
        <option>6番アイアン</option>
        <option selected>7番アイアン</option>
        <option>8番アイアン</option>
        <option>9番アイアン</option>
        <option>PW</option>
        <option>SW</option>

    </select>

</div>


<!-- 飛距離 -->

<div class="card">

    <span class="badge">STEP 4</span>

    <h2>📏 飛距離</h2>

    <label>
        ボールが落ちた場所の距離
    </label>

    <input
        id="distanceInput"
        type="number"
        placeholder="例：150"
        step="1">

    <button
        id="saveDistance"
        style="width:100%; margin-top:10px;">
        飛距離を記録
    </button>

    <div
        id="result"
        class="result">
        --- yd
    </div>

    <div class="stats">

        <div class="stat">

            <div
                id="best"
                class="number">
                --
            </div>

            <div class="unit">
                最高飛距離 yd
            </div>

        </div>

        <div class="stat">

            <div
                id="average"
                class="number">
                --
            </div>

            <div class="unit">
                平均飛距離 yd
            </div>

        </div>

        <div class="stat">

            <div
                id="count"
                class="number">
                0
            </div>

            <div class="unit">
                記録球数
            </div>

        </div>

    </div>

</div>


<!-- 記録 -->

<div class="card">

    <h2>📋 今日の記録</h2>

    <div id="log">
        まだ記録がありません。
    </div>

</div>


<div class="card">

    <div class="note">

        ※現在は試作版です。<br>
        AI骨格検出によるフォーム確認と
        飛距離記録を中心にしています。<br>
        カメラだけから得られる飛距離は
        正確な実測値ではありません。

    </div>

</div>

</div>


<!-- MediaPipe AI -->

<script type="module">

import {
    FilesetResolver,
    PoseLandmarker
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const startCamera =
    document.getElementById("startCamera");

const stopCamera =
    document.getElementById("stopCamera");

const aiButton =
    document.getElementById("aiButton");

const aiMessage =
    document.getElementById("aiMessage");


let stream = null;

let poseLandmarker = null;

let animationId = null;


/* ---------------------------
   飛距離記録
--------------------------- */

let distances =
    JSON.parse(
        localStorage.getItem(
            "golfDistances"
        ) || "[]"
    );


function updateStats() {

    const count =
        document.getElementById("count");

    const best =
        document.getElementById("best");

    const average =
        document.getElementById("average");

    const log =
        document.getElementById("log");


    count.textContent =
        distances.length;


    if (distances.length === 0) {

        best.textContent = "--";

        average.textContent = "--";

        log.textContent =
            "まだ記録がありません。";

        return;
    }


    best.textContent =
        Math.max(...distances);


    const avg =
        distances.reduce(
            (a, b) => a + b,
            0
        ) / distances.length;


    average.textContent =
        Math.round(avg);


    log.textContent =
        distances
        .map(
            (d, i) =>
                `${i + 1}球目　${d} yd`
        )
        .join("\n");
}


updateStats();


/* ---------------------------
   カメラ開始
--------------------------- */

startCamera.onclick =
async function () {

    try {

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        "environment"

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        startCamera.disabled =
            true;

        stopCamera.disabled =
            false;


        resizeCanvas();


    } catch (error) {

        alert(
            "カメラを使用できません。\n\n" +
            "iPhoneの設定から、このWEBアプリの" +
            "カメラ使用を許可してください。"
        );

    }

};


/* ---------------------------
   カメラ停止
--------------------------- */

stopCamera.onclick =
function () {

    if (stream) {

        stream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    }


    stream = null;

    video.srcObject = null;


    startCamera.disabled =
        false;

    stopCamera.disabled =
        true;


    cancelAnimationFrame(
        animationId
    );

};


/* ---------------------------
   Canvasサイズ
--------------------------- */

function resizeCanvas() {

    canvas.width =
        video.videoWidth ||
        640;

    canvas.height =
        video.videoHeight ||
        360;

}


video.onloadedmetadata =
resizeCanvas;


/* ---------------------------
   AIモデル読み込み
--------------------------- */

async function loadAI() {

    if (poseLandmarker) {

        return;

    }


    aiMessage.textContent =
        "AIモデルを読み込んでいます…";


    const vision =
        await FilesetResolver
        .forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


    poseLandmarker =
        await PoseLandmarker
        .createFromOptions(
            vision,
            {

                baseOptions: {

                    modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

                },

                runningMode:
                    "VIDEO",

                numPoses:
                    1

            }
        );

}


/* ---------------------------
   AI骨格描画
--------------------------- */

function drawPose() {

    if (!poseLandmarker) {

        return;

    }


    if (video.readyState < 2) {

        animationId =
            requestAnimationFrame(
                drawPose
            );

        return;

    }


    const result =
        poseLandmarker
        .detectForVideo(
            video,
            performance.now()
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        result.landmarks &&
        result.landmarks.length
    ) {

        const points =
            result.landmarks[0];


        const connections = [

            [11,12],

            [11,23],

            [12,24],

            [23,24],

            [11,13],

            [13,15],

            [12,14],

            [14,16],

            [23,25],

            [25,27],

            [24,26],

            [26,28]

        ];


        ctx.lineWidth = 4;

        ctx.strokeStyle =
            "#00e5ff";

        ctx.fillStyle =
            "#ffffff";


        connections.forEach(
            ([a,b]) => {

                if (
                    points[a] &&
                    points[b]
                ) {

                    ctx.beginPath();

                    ctx.moveTo(
                        points[a].x *
                        canvas.width,

                        points[a].y *
                        canvas.height
                    );

                    ctx.lineTo(
                        points[b].x *
                        canvas.width,

                        points[b].y *
                        canvas.height
                    );

                    ctx.stroke();

                }

            }
        );


        points.forEach(
            point => {

                if (
                    point.visibility >
                    0.5
                ) {

                    ctx.beginPath();

                    ctx.arc(

                        point.x *
                        canvas.width,

                        point.y *
                        canvas.height,

                        5,

                        0,

                        Math.PI * 2

                    );

                    ctx.fill();

                }

            }
        );

    }


    animationId =
        requestAnimationFrame(
            drawPose
        );

}


/* ---------------------------
   AIボタン
--------------------------- */

aiButton.onclick =
async function () {

    try {

        await loadAI();


        cancelAnimationFrame(
            animationId
        );


        drawPose();


        aiMessage.textContent =
`AI骨格検出を開始しました。

画面上に、

・頭
・肩
・肘
・手
・腰
・膝
・足

などの位置を表示しています。

次の段階では、

「アドレス」
「トップ」
「インパクト」
「フィニッシュ」

を自動判定できるように発展させられます。`;


    } catch (error) {

        console.error(error);


        aiMessage.textContent =
            "AIモデルを読み込めませんでした。\n" +
            "インターネット接続を確認してください。";

    }

};


/* ---------------------------
   飛距離記録
--------------------------- */

document
.getElementById("saveDistance")
.onclick =
function () {

    const input =
        document.getElementById(
            "distanceInput"
        );


    const value =
        parseFloat(
            input.value
        );


    if (
        !Number.isFinite(value) ||
        value <= 0
    ) {

        alert(
            "飛距離を入力してください。"
        );

        return;

    }


    const distance =
        Math.round(value);


    distances.push(
        distance
    );


    localStorage.setItem(
        "golfDistances",
        JSON.stringify(
            distances
        )
    );


    document.getElementById(
        "result"
    ).textContent =
        distance + " yd";


    updateStats();


    input.value = "";

};


</script>

</body>
</html>
